version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "npm"
    directory: "/apps/web"
    schedule:
      interval: "weekly"
  - package-ecosystem: "npm"
    directory: "/apps/history-ts"
    schedule:
      interval: "weekly"
  - package-ecosystem: "pip"
    directory: "/apps/notify-py"
    schedule:
      interval: "weekly"
  - package-ecosystem: "cargo"
    directory: "/apps/auth-rs"
    schedule:
      interval: "weekly"
  - package-ecosystem: "cargo"
    directory: "/apps/phishing-rs"
    schedule:
      interval: "weekly"
  - package-ecosystem: "cargo"
    directory: "/apps/malware-rs"
    schedule:
      interval: "weekly"
  - package-ecosystem: "gomod"
    directory: "/apps/report-go"
    schedule:
      interval: "weekly"
