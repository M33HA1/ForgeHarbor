[package]
name = "auth-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
actix-web = "4.11.0"
actix-cors = "0.7.1"
actix-web-httpauth = "0.8.2"
tokio = { version = "1.47.1", features = ["full"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
mongodb = "=3.2.5"
redis = { version = "0.32.5", features = ["tokio-comp", "connection-manager"] }
jsonwebtoken = "9.3.1"
base64 = "0.22.1"
argon2 = "0.5.3"
tracing = "0.1.41"
tracing-subscriber = "0.3.20"
tracing-actix-web = "0.7.19"
uuid = { version = "1.18.1", features = ["v4", "serde"] }
anyhow = "1.0.99"
dotenv = "0.15.0"
chrono = { version = "0.4.41", features = ["serde"] }
sha2 = "0.10.9"
sha1 = "0.10.6"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
