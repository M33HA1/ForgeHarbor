[package]
name = "phishing-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
actix-web = "4.18.1"
actix-cors = "0.7.2"
actix-web-httpauth = "0.8.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.50.0", features = ["full"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls-no-provider"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
dotenvy = "0.15.7"
futures-util = "0.3.34"
mongodb = "3.10.0"
jsonwebtoken = { version = "11.1.0", features = ["aws_lc_rs"] }
chrono = { version = "0.4.45", features = ["serde"] }