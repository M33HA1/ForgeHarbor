version: "3.9"

services:
  # -------------------------
  # Traefik reverse proxy
  # -------------------------
  traefik:
    image: traefik:v2.10
    container_name: traefik
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--entrypoints.web.address=:80"
    ports:
      - "80:80"
      - "8080:8080" # Traefik dashboard
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    labels:
      - "traefik.enable=false"

  # -------------------------
  # Auth Service (Rust)
  # -------------------------
  fh-auth:
    image: compose-auth-rs:latest
    container_name: fh-auth
    env_file:
      - ../../config/.env
    depends_on:
      - fh-mongo
      - fh-redis
      - fh-rabbit
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.fh-auth.rule=Host(`auth.localhost`)"
      - "traefik.http.services.fh-auth.loadbalancer.server.port=8080"

  # -------------------------
  # Phishing Service (Rust)
  # -------------------------
  fh-phishing:
    image: compose-phishing-rs:latest
    container_name: fh-phishing
    env_file:
      - ../../config/.env
    depends_on:
      - fh-auth
      - fh-mongo
      - fh-redis
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.fh-phishing.rule=Host(`phishing.localhost`)"
      - "traefik.http.services.fh-phishing.loadbalancer.server.port=8081"

  # -------------------------
  # Malware Service (Rust)
  # -------------------------
  fh-malware:
    image: compose-malware-rs:latest
    container_name: fh-malware
    env_file:
      - ../../config/.env
    depends_on:
      - fh-auth
      - fh-mongo
      - fh-redis
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.fh-malware.rule=Host(`malware.localhost`)"
      - "traefik.http.services.fh-malware.loadbalancer.server.port=8082"

  # -------------------------
  # History Service (TypeScript)
  # -------------------------
  fh-history:
    image: compose-history-ts:latest
    container_name: fh-history
    env_file:
      - ../../config/.env
    depends_on:
      - fh-mongo
      - fh-redis
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.fh-history.rule=Host(`history.localhost`)"
      - "traefik.http.services.fh-history.loadbalancer.server.port=8083"

  # -------------------------
  # Report Service (Go)
  # -------------------------
  fh-report:
    image: compose-report-go:latest
    container_name: fh-report
    env_file:
      - ../../config/.env
    depends_on:
      - fh-mongo
      - fh-redis
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.fh-report.rule=Host(`report.localhost`)"
      - "traefik.http.services.fh-report.loadbalancer.server.port=8084"

  # -------------------------
  # Notification Service (Python)
  # -------------------------
  fh-notify:
    image: compose-notify-py:latest
    container_name: fh-notify
    env_file:
      - ../../config/.env
    depends_on:
      - fh-rabbit
      - fh-redis
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.fh-notify.rule=Host(`notify.localhost`)"
      - "traefik.http.services.fh-notify.loadbalancer.server.port=8085"

  # -------------------------
  # Web Frontend (Node/Serve)
  # -------------------------
  fh-web:
    image: compose-fh-web:latest
    container_name: fh-web
    env_file:
      - ../../config/.env
    depends_on:
      - fh-auth
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.fh-web.rule=Host(`web.localhost`)"
      - "traefik.http.services.fh-web.loadbalancer.server.port=3000"

  # -------------------------
  # MinIO Object Storage
  # -------------------------
  fh-minio:
    image: minio/minio:latest
    container_name: fh-minio
    env_file:
      - ../../config/.env
    command: server /data --console-address ":9001"
    labels:
      - "traefik.enable=false"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - fh-minio-data:/data

  # -------------------------
  # MongoDB
  # -------------------------
  fh-mongo:
    image: mongo:6.0
    container_name: fh-mongo
    env_file:
      - ../../config/.env
    labels:
      - "traefik.enable=false"
    ports:
      - "27017:27017"
    volumes:
      - fh-mongo-data:/data/db

  # -------------------------
  # Redis
  # -------------------------
  fh-redis:
    image: redis:7-alpine
    container_name: fh-redis
    labels:
      - "traefik.enable=false"
    ports:
      - "6379:6379"

  # -------------------------
  # RabbitMQ
  # -------------------------
  fh-rabbit:
    image: rabbitmq:3-management
    container_name: fh-rabbit
    env_file:
      - ../../config/.env
    labels:
      - "traefik.enable=false"
    ports:
      - "15672:15672"

# -------------------------
# Volumes
# -------------------------
volumes:
  fh-mongo-data:
  fh-minio-data:
