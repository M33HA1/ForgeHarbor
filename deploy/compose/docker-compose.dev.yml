networks:
  forgeharbor-network:
    driver: bridge
  forgeharbor-auth-edge:
    name: forgeharbor-auth-edge
    driver: bridge
    ipam:
      config:
        - subnet: 172.31.240.0/29

services:
  # -------------------------
  # Traefik reverse proxy
  # -------------------------
  traefik:
    image: traefik:v3.7
    container_name: traefik
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.file.filename=/etc/traefik/dynamic.yml"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.traefik.address=:8000"
      - "--providers.docker.exposedbydefault=false"
      - "--log.level=INFO"
    ports:
      - "127.0.0.1:8088:80"    # API Gateway
      - "127.0.0.1:8000:8000"  # Traefik dashboard
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ../traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro
    networks:
      forgeharbor-network: {}
      forgeharbor-auth-edge:
        ipv4_address: 172.31.240.2
    labels:
      - "traefik.enable=false"

  # -------------------------
  # Auth Service (Go; legacy Rust implementation available via rollback overlay)
  # -------------------------
  fh-auth:
    build:
      context: ../../apps/controlplane-go
      dockerfile: Dockerfile
    command: [auth]
    container_name: fh-auth
    env_file:
      - ../../config/.env
    depends_on:
      fh-mongo:
        condition: service_healthy
      fh-redis:
        condition: service_healthy
      fh-rabbit:
        condition: service_healthy
    networks:
      forgeharbor-network: {}
      forgeharbor-auth-edge:
        ipv4_address: 172.31.240.3
    environment:
      AUTH_TRUSTED_PROXY_IPS: ${AUTH_TRUSTED_PROXY_IPS:-172.31.240.2,172.31.240.4}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.fh-auth.rule=Host(`localhost`) && PathPrefix(`/auth`)"
      - "traefik.http.routers.fh-auth.priority=100"
      - "traefik.http.services.fh-auth.loadbalancer.server.port=8080"
      - "traefik.docker.network=forgeharbor-auth-edge"
    volumes:
      - ../../apps/auth-rs/config:/app/config:ro
    ports:
      - "127.0.0.1:8080:8080"

  # Loopback-only proxy used to verify that forwarded client IPs are accepted
  # only from an explicitly trusted peer. Start with --profile integration.
  fh-auth-test-proxy:
    image: nginx:1.29-alpine
    container_name: fh-auth-test-proxy
    profiles: [integration]
    depends_on:
      fh-auth:
        condition: service_started
    volumes:
      - ../traefik/auth-test-proxy.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      forgeharbor-auth-edge:
        ipv4_address: 172.31.240.4
    ports:
      - "127.0.0.1:8086:8080"

  # -------------------------
  # Phishing Service (Rust)
  # -------------------------
  fh-phishing:
    build:
      context: ../../apps/phishing-rs
      dockerfile: Dockerfile
    container_name: fh-phishing
    env_file:
      - ../../config/.env
    depends_on:
      fh-auth:
        condition: service_started
      fh-mongo:
        condition: service_healthy
      fh-redis:
        condition: service_healthy
    networks:
      - forgeharbor-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.fh-phishing.rule=Host(`localhost`) && PathPrefix(`/phishing`)"
      - "traefik.http.routers.fh-phishing.priority=100"
      - "traefik.http.routers.fh-phishing.middlewares=fh-jwt@file"
      - "traefik.http.routers.fh-phishing-public.rule=Host(`localhost`) && ((Method(`GET`) && Path(`/phishing/health`)) || (Method(`OPTIONS`) && PathPrefix(`/phishing`)))"
      - "traefik.http.routers.fh-phishing-public.priority=110"
      - "traefik.http.routers.fh-phishing-public.service=fh-phishing"
      - "traefik.http.services.fh-phishing.loadbalancer.server.port=8081"
    volumes:
      - ../../apps/phishing-rs/config:/app/config:ro
    ports:
      - "127.0.0.1:8081:8081"

  # -------------------------
  # Malware Service (Rust)
  # -------------------------
  fh-malware:
    build:
      context: ../../apps/malware-rs
      dockerfile: Dockerfile
    container_name: fh-malware
    env_file:
      - ../../config/.env
    depends_on:
      fh-auth:
        condition: service_started
      fh-mongo:
        condition: service_healthy
      fh-redis:
        condition: service_healthy
    networks:
      - forgeharbor-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.fh-malware.rule=Host(`localhost`) && PathPrefix(`/malware`)"
      - "traefik.http.routers.fh-malware.priority=100"
      - "traefik.http.routers.fh-malware.middlewares=fh-jwt@file"
      - "traefik.http.routers.fh-malware-public.rule=Host(`localhost`) && ((Method(`GET`) && Path(`/malware/health`)) || (Method(`OPTIONS`) && PathPrefix(`/malware`)))"
      - "traefik.http.routers.fh-malware-public.priority=110"
      - "traefik.http.routers.fh-malware-public.service=fh-malware"
      - "traefik.http.services.fh-malware.loadbalancer.server.port=8082"
    volumes:
      - ../../apps/malware-rs/config:/app/config:ro
    ports:
      - "127.0.0.1:8082:8082"

  # -------------------------
  # History Service (Go; TypeScript implementation retained for rollback)
  # -------------------------
  fh-history:
    build:
      context: ../../apps/controlplane-go
      dockerfile: Dockerfile
    command: [history]
    container_name: fh-history
    env_file:
      - ../../config/.env
    volumes:
      - ../../apps/auth-rs/config/jwt-public.pem:/app/config/jwt-public.pem:ro
    depends_on:
      fh-mongo:
        condition: service_healthy
      fh-redis:
        condition: service_healthy
    networks:
      - forgeharbor-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.fh-history.rule=Host(`localhost`) && PathPrefix(`/history`)"
      - "traefik.http.routers.fh-history.priority=100"
      - "traefik.http.routers.fh-history.middlewares=fh-jwt@file"
      - "traefik.http.routers.fh-history-public.rule=Host(`localhost`) && ((Method(`GET`) && Path(`/history/health`)) || (Method(`OPTIONS`) && PathPrefix(`/history`)))"
      - "traefik.http.routers.fh-history-public.priority=110"
      - "traefik.http.routers.fh-history-public.service=fh-history"
      - "traefik.http.services.fh-history.loadbalancer.server.port=8083"
    ports:
      - "127.0.0.1:8083:8083"

  # -------------------------
  # Report Service (Go)
  # -------------------------
  fh-report:
    build:
      context: ../../apps/report-go
      dockerfile: Dockerfile
    container_name: fh-report
    env_file:
      - ../../config/.env
    volumes:
      - ../../apps/auth-rs/config/jwt-public.pem:/app/config/jwt-public.pem:ro
    environment:
      - MONGO_URI=mongodb://fh-mongo:27017
      - MONGO_DB=forgeharbor
      - RABBITMQ_URL=amqp://guest:guest@fh-rabbit:5672
      - S3_ENDPOINT=http://fh-minio:9000
      - S3_REGION=us-east-1
      - S3_BUCKET=forgeharbor-reports
      - S3_ACCESS_KEY=minioadmin
      - S3_SECRET_KEY=minioadmin
    depends_on:
      fh-mongo:
        condition: service_healthy
      fh-redis:
        condition: service_healthy
      fh-minio:
        condition: service_healthy
    networks:
      - forgeharbor-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.fh-report.rule=Host(`localhost`) && PathPrefix(`/reports`)"
      - "traefik.http.routers.fh-report.priority=100"
      - "traefik.http.routers.fh-report.middlewares=fh-jwt@file"
      - "traefik.http.routers.fh-report-public.rule=Host(`localhost`) && ((Method(`GET`) && Path(`/reports/health`)) || (Method(`OPTIONS`) && PathPrefix(`/reports`)))"
      - "traefik.http.routers.fh-report-public.priority=110"
      - "traefik.http.routers.fh-report-public.service=fh-report"
      - "traefik.http.services.fh-report.loadbalancer.server.port=8084"
    ports:
      - "127.0.0.1:8084:8084"

  # -------------------------
  # Notification Service (Go; Python implementation retained for rollback)
  # -------------------------
  fh-notify:
    build:
      context: ../../apps/controlplane-go
      dockerfile: Dockerfile
    command: [notify]
    container_name: fh-notify
    env_file:
      - ../../config/.env
    volumes:
      - ../../apps/auth-rs/config/jwt-public.pem:/app/config/jwt-public.pem:ro
    depends_on:
      fh-rabbit:
        condition: service_healthy
      fh-redis:
        condition: service_healthy
    networks:
      - forgeharbor-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.fh-notify.rule=Host(`localhost`) && PathPrefix(`/notify`)"
      - "traefik.http.routers.fh-notify.priority=100"
      - "traefik.http.routers.fh-notify.middlewares=fh-jwt@file"
      - "traefik.http.routers.fh-notify-public.rule=Host(`localhost`) && ((Method(`GET`) && Path(`/notify/health`)) || (Method(`OPTIONS`) && PathPrefix(`/notify`)))"
      - "traefik.http.routers.fh-notify-public.priority=110"
      - "traefik.http.routers.fh-notify-public.service=fh-notify"
      - "traefik.http.services.fh-notify.loadbalancer.server.port=8085"
    ports:
      - "127.0.0.1:8085:8085"

  # -------------------------
  # Web Frontend (Node/Serve)
  # -------------------------
  fh-web:
    build:
      context: ../../apps/web
      dockerfile: Dockerfile
    container_name: fh-web
    env_file:
      - ../../config/.env
    depends_on:
      fh-auth:
        condition: service_started
    networks:
      - forgeharbor-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.fh-web.rule=Host(`localhost`)"
      - "traefik.http.routers.fh-web.priority=1"
      - "traefik.http.services.fh-web.loadbalancer.server.port=3000"
    ports:
      - "127.0.0.1:3000:3000"

  # -------------------------
  # S3-compatible Object Storage (RustFS)
  # -------------------------
  fh-minio:
    image: ghcr.io/rustfs/rustfs:1.0.1-glibc@sha256:aa7ccf0a266c1421c843a13272d9bf0f09f2f71c890178f55913ba0106532869
    container_name: fh-minio
    env_file:
      - ../../config/.env
    environment:
      - RUSTFS_VOLUMES=/data
      - RUSTFS_ADDRESS=0.0.0.0:9000
      - RUSTFS_CONSOLE_ADDRESS=0.0.0.0:9001
      - RUSTFS_CONSOLE_ENABLE=true
      - RUSTFS_ACCESS_KEY=minioadmin
      - RUSTFS_SECRET_KEY=minioadmin
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/health"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s
    networks:
      - forgeharbor-network
    labels:
      - "traefik.enable=false"
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - fh-minio-data:/data

  # -------------------------
  # MongoDB
  # -------------------------
  fh-mongo:
    image: mongo:6.0
    container_name: fh-mongo
    networks:
      - forgeharbor-network
    labels:
      - "traefik.enable=false"
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - fh-mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      retries: 5
      timeout: 5s

  # -------------------------
  # Redis
  # -------------------------
  fh-redis:
    image: redis:7-alpine
    container_name: fh-redis
    networks:
      - forgeharbor-network
    labels:
      - "traefik.enable=false"
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      retries: 5
      timeout: 5s

  # -------------------------
  # RabbitMQ
  # -------------------------
  fh-rabbit:
    image: rabbitmq:3-management
    container_name: fh-rabbit
    env_file:
      - ../../config/.env
    networks:
      - forgeharbor-network
    labels:
      - "traefik.enable=false"
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmqctl", "status"]
      interval: 10s
      retries: 5
      timeout: 5s

# -------------------------
# Volumes
# -------------------------
volumes:
  fh-mongo-data:
  fh-minio-data:
